name: Gerar APK - NOBRE FLORESTAL PROJETO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Gerar APK
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "NOBRE FLORESTAL- PROJETO.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOBRE FLORESTAL- PROJETO
          path: "NOBRE FLORESTAL- PROJETO.apk"

          name: Gerar APK - NOBRE FLORESTAL PROJETO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          mkdir -p projeto
          unzip -o NOBRE_FLORESTAL_PROJETO_ATUALIZADO_GITHUB.zip -d projeto

      - name: Localizar e preparar Gradle
        run: |
          GRADLEW=$(find projeto -type f -name gradlew | head -n 1)
          echo "Gradle encontrado em: $GRADLEW"

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: gradlew não encontrado"
            find projeto -maxdepth 4 -type f
            exit 1
          fi

          chmod +x "$GRADLEW"

          GRADLE_DIR=$(dirname "$GRADLEW")
          echo "GRADLE_DIR=$GRADLE_DIR" >> $GITHUB_ENV

      - name: Gerar APK
        run: |
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug

      - name: Localizar APK
        run: |
          APK=$(find "$GRADLE_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado"
            exit 1
          fi

          cp "$APK" "NOBRE FLORESTAL- PROJETO.apk"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOBRE-FLORESTAL-PROJETO
          path: "NOBRE FLORESTAL- PROJETO.apk"

name: Gerar APK NOBRE FLORESTAL - PROJETO

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Localizar e preparar projeto Android
        shell: bash
        run: |
          set -e

          # Se o projeto já estiver extraído no repositório, usa ele.
          GRADLEW=$(find "$GITHUB_WORKSPACE" -type f -name gradlew -not -path "$GITHUB_WORKSPACE/projeto/*" | head -n 1 || true)

          if [ -n "$GRADLEW" ]; then
            PROJECT_ROOT=$(dirname "$GRADLEW")
            echo "Projeto Android já extraído: $PROJECT_ROOT"
          else
            # Se houver ZIP(s), testa um por um e usa o primeiro que contém gradlew.
            rm -rf "$GITHUB_WORKSPACE/projeto"
            mkdir -p "$GITHUB_WORKSPACE/projeto"
            PROJECT_ROOT=""

            while IFS= read -r -d '' ZIP; do
              echo "Testando ZIP: $ZIP"
              rm -rf "$GITHUB_WORKSPACE/projeto"/*

             

name: Gerar APK UPA13

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip -o UPA13_GITHUB_GERA_APK.zip -d projeto

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Gerar APK
        working-directory: projeto/UPA13_ANDROIDIDE_COMPATIVEL
        run: gradle --no-daemon clean assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: UPA13-APK
          path: projeto/UPA13_ANDROIDIDE_COMPATIVEL/app/build/outputs/apk/debug/app-debug.apk
